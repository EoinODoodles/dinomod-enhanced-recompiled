# WCMoonTempleDoor 
# A copy of ObjSeq 0x3BB, but moving down instead of up.
# The Sun Door's side of the temple has a slope directly above the Sun Door, so it can safely be raised.
# The Moon Door just has a flat walkway above it though, so it sticks up through the ground nonsensically when raised.
# This sequence addresses that, having the Moon Door sink into the ground instead!
# The Moon Door's model only includes the door's top face (and not the bottom), so this seems to have been Rare's intention.

