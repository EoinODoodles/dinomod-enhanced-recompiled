# Walled City - Jungle Door Opens 
# Animator: Banjeoin
# Just a basic version of the sequence to get the idea across, but it'd be nice to revisit and try a more dramatic version someday!
# TODO: optimise curves! Used baked keys temporarily, since the eases were giving me grief and I ran out of time to fix 'em for the moment

actors:
# Actor 0
- uid: 0x0
  settings: 0x800
  objectID: 0xFFFF # Self (WCSeqObject)
# Actor 1
- uid: 0x0
  settings: 0x9000
  objectID: 0xFFFE # Camera
# Actor 2
- uid: 0x0
  settings: 0x5000
  objectID: 0x157 # LevelName

curves:
# Curve 0 (WCSeqObject)
- events:
  - { type: 0, delay: 0, params: 0 } # SETTIME @ 0
  - { type: -1, delay: 0, params: 635 } # SETDURATION @ 0
  - { type: 3, delay: 0, params: 0x0 } # OVERRIDE @ 0

  # Lock player
  - { type: 11, delay: 0, params: 1 } # CODE
  - { code_type: 6, val1: 0x25, val2: 1 } # 6 (TOGGLE_PLAYER_CONTROL | OFF)

  - { type: 0, delay: 0, params: 1 } # SETTIME
  - { type: 6, delay: 0, params: 0xEB5A } # SFX   lock opening sound

  #Camera shake (player distance independent)
  - { type: 0, delay: 0, params: 64 } # SETTIME
  - { type: 11, delay: 0, params: 1 } # CODE
  - { code_type: 6, val1: 0x7, val2: 0x87 } # 6 (CAMERA_SHAKE) (PLAYER_INDEPENDENT, 1)

  - { type: 0, delay: 0, params: 68 } # SETTIME
  - { type: 6, delay: 0, params: 0xE127 } # SFX   rumble

  # Enable objectGroup 18 (Jungle Door FXEmits)
  - { type: 0, delay: 0, params: 200 } # SETTIME @ 0
  - { type: 11, delay: 0, params: 1 } # CODE
  - { code_type: 6, val1: 0x1B, val2: 18 } # 6 (ENABLE_OBJ_GROUP)

  #Camera shake (player distance independent)
  - { type: 0, delay: 0, params: 222 } # SETTIME
  - { type: 11, delay: 0, params: 1 } # CODE
  - { code_type: 6, val1: 0x7, val2: 0x8B } # 6 (CAMERA_SHAKE)  (PLAYER_INDEPENDENT, 5)

  - { type: 0, delay: 0, params: 635 } # SETTIME

  # Disable objectGroup 18 (Jungle Door FXEmits)
  - { type: 11, delay: 0, params: 1 } # CODE
  - { code_type: 6, val1: 0x1C, val2: 18 } # 6 (DISABLE_OBJ_GROUP)

    # Unlock player
  - { type: 11, delay: 0, params: 1 } # CODE
  - { code_type: 6, val1: 0x25, val2: 0 } # 6 (TOGGLE_PLAYER_CONTROL | ON)

  - { type: 11, delay: 0, params: 1 } # CODE
  - { code_type: 6, val1: 0x0, val2: 0x0 } # 6 (0)
  keyframes:
# Curve 1 (Camera)
- events:
  - { type: 0, delay: 0, params: 0 } # SETTIME @ 0
  - { type: -1, delay: 0, params: 635 } # SETDURATION @ 0

  # Seize camera
  - { type: 3, delay: 0, params: 0x0 } # OVERRIDE @ 0
  - { type: 1, delay: 0, params: 0x0 } # MOVEMODE @ 0

  - { type: 0, delay: 0, params: 64 } # SETTIME
  - { type: 6, delay: 0, params: 0xE9DF } # SFX   eerie squeak

  - { type: 0, delay: 0, params: 111 } # SETTIME
  - { type: 6, delay: 0, params: 0xFB59 } # SFX   wood/rope creak loop (needs vol keys)

  - { type: 0, delay: 0, params: 224 } # SETTIME
  - { type: 6, delay: 0, params: 0xE9C9 } # SFX   heavy shift

  - { type: 0, delay: 0, params: 635 } # SETTIME

  # Release camera
  - { type: 3, delay: 0, params: 0x0 } # OVERRIDE
  - { type: 1, delay: 0, params: 0x0 } # MOVEMODE

  # Cut back to player
  - { type: 11, delay: 0, params: 1 } # CODE
  - { code_type: 6, val1: 0x1A, val2: 0x0 } # 6 (NORMAL_CAMERA)

  - { type: 11, delay: 0, params: 1 } # CODE
  - { code_type: 6, val1: 0x0, val2: 0x0 } # 6 (0)
