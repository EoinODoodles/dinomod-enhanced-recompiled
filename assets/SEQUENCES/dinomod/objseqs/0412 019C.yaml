  - { type: 1, delay: 5, params: 0x0 } # MOVEMODE @ 30
  - { type: 11, delay: 0, params: 1 } # CODE @ 35
  - { code_type: 6, val1: 0xF, val2: 0x1E } # 6 (15)
  - { type: 0, delay: 0, params: 535 } # SETTIME @ 35
  - { type: 11, delay: 35, params: 1 } # CODE @ 535
  - { code_type: 6, val1: 0x1A, val2: 0x0 } # 6 (NORMAL_CAMERA)
  - { type: 11, delay: 0, params: 1 } # CODE @ 570
  - { code_type: 6, val1: 0x0, val2: 0x0 } # 6 (0)
