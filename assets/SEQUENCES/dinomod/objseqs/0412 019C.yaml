# DarkIce Mines - Icebergs Flow in Waterfall Cave

# Modified to lock player control until the cutscene's finished

actors:
# Actor 0
- uid: 0x0
  settings: 0x0
  objectID: 0xFFFF # Self (DIM2SeqObject)
# Actor 1
- uid: 0x0
  settings: 0x9000
  objectID: 0xFFFE # Camera

curves:
# Curve 0
- events:
  - { type: 0, delay: 0, params: 0 } # SETTIME @ 0
  - { type: -1, delay: 0, params: 605 } # SETDURATION @ 0

  # Lock player
  - { type: 11, delay: 0, params: 1 } # CODE
  - { code_type: 6, val1: 0x25, val2: 1 } # 6 (TOGGLE_PLAYER_CONTROL | OFF)

  - { type: 3, delay: 70, params: 0x0 } # OVERRIDE @ 0
  - { type: 11, delay: 0, params: 1 } # CODE @ 70
  - { code_type: 2, val1: 0x0, val2: 0x1 } # SET (MESSAGE)
  - { type: 0, delay: 0, params: 535 } # SETTIME @ 70
  - { type: 11, delay: 35, params: 1 } # CODE @ 535
  - { code_type: 6, val1: 0xE, val2: 0x1E } # 6 (14)
  - { type: 11, delay: 35, params: 1 } # CODE @ 570
  - { code_type: 6, val1: 0xF, val2: 0x1E } # 6 (15)

  # Unlock player
  - { type: 11, delay: 0, params: 1 } # CODE
  - { code_type: 6, val1: 0x25, val2: 0 } # 6 (TOGGLE_PLAYER_CONTROL | ON)

  - { type: 11, delay: 0, params: 1 } # CODE @ 605
  - { code_type: 6, val1: 0x0, val2: 0x0 } # 6 (0)
  keyframes:
# Curve 1
- events:
