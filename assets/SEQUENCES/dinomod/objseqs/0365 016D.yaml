# Discovery Falls - MMP Door Opens
# Edited so the door disappears fully underground, instead of leaving a little pixel of the top of the door

actors:
# Actor 0
- uid: 0x0
  settings: 0x1000
  objectID: 0xFFFF # Self (DFmoondoor)

curves:
# Curve 0
- events:
  - { type: 0, delay: 0, params: 0 } # SETTIME @ 0
  - { type: -1, delay: 0, params: 90 } # SETDURATION @ 0
  - { type: 3, delay: 79, params: 0x0 } # OVERRIDE @ 0     #@recomp: change delay
  - { type: 11, delay: 11, params: 1 } # CODE @ 79         #@recomp: change delay
  - { code_type: 2, val1: 0x0, val2: 0x2 } # SET (MESSAGE)
  - { type: 11, delay: 0, params: 1 } # CODE @ 90
  - { code_type: 6, val1: 0x0, val2: 0x0 } # 6 (0)
  keyframes:
    # TRANSLATE_Y
  - { channel: 12, time: 0, value: -0.054004013538360596, interp: 1, weight: 56 }
  - { channel: 12, time: 80, value: -92.21086883544922, interp: 1, weight: 60 } #@recomp: disappear fully underground
