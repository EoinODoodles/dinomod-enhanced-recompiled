# SwapStone Hollow: Queen EarthWalker Cries for Help (Part 1)
# Edited to avoid the roar MP3 continuing into Seq 0xD9, which could sometimes stop Tricky from speaking

actors:
# Actor 0
- uid: 0x0
  settings: 0x1000
  objectID: 0xFFFF # Self (SHqueenearthwal, SHseqobject)

